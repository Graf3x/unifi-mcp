# Tests on every push and pull request, then builds the image for amd64 and arm64, each on a runner of its own
# architecture, and starts it through tools/image-gate.sh (healthy startup as a non-root user on a read-only filesystem,
# the setup listener kept apart), so a broken image shows before a release.
# On a v* tag: builds the multi-arch image (linux/amd64, linux/arm64) and pushes it to ghcr.io/<owner>/unifi-mcp by
# digest only, runs the same gate on that exact digest on both architectures, and only then tags it <version>,
# <major>.<minor> and latest. A gate failure leaves an untagged digest that nothing points at. Uses only GITHUB_TOKEN.
# A prerelease tag (a hyphen in it, e.g. v1.2.3-rc.1) gets only its own version and leaves latest alone.
# A new GHCR package starts private: make it public under the package's settings so others can pull without logging in.
# ubuntu-24.04-arm is GitHub's hosted arm64 runner (public repositories); a private fork needs its own arm64 runner there.
# Every action is pinned to a commit SHA, its tag as a comment; Dependabot (.github/dependabot.yml) keeps the pins current.
name: test and image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test unifi-mcp.slnx -c Release
      # The Fleet build checks deploy/SHA256SUMS; a stale or incomplete one breaks it, so CI checks it too.
      - name: deploy/SHA256SUMS matches the sources
        run: |
          set -euo pipefail
          sha256sum -c --quiet deploy/SHA256SUMS
          tracked=$(git ls-files src/UnifiMcp | LC_ALL=C sort)
          listed=$(sed 's/^[0-9a-f]* \*//' deploy/SHA256SUMS)
          diff <(printf '%s\n' "$tracked") <(printf '%s\n' "$listed")

  image-check:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: unifi-mcp:gate
          cache-from: type=gha
      - name: Start the image through the gate
        run: bash tools/image-gate.sh unifi-mcp:gate "${{ matrix.platform }}"

  # Runs both tunnel Compose files on Linux: the tunnel container reaches the public socket and never the tailnet one,
  # and the host's tailnet route survives a restart. See the script's header.
  socket-isolation:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tests/compose/socket-isolation.sh docker-compose.yml
      - run: bash tests/compose/socket-isolation.sh deploy/compose.yaml

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image name (registry paths must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unifi-mcp" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
      # By digest only: no tag exists until image-gate passes on this digest.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-gate:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image name (registry paths must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unifi-mcp" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the pushed digest through the gate
        run: bash tools/image-gate.sh "${IMAGE}@${{ needs.image.outputs.digest }}" "${{ matrix.platform }}"

  promote:
    needs: [image, image-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name (registry paths must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unifi-mcp" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Tag the gated digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # The same platform images the gate started, under the release tags; nothing is rebuilt.
          # shellcheck disable=SC2046 # one "-t <tag>" word pair per tag
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") "${IMAGE}@${DIGEST}"
          # Check it: the first tag lists exactly the platform images of the gated digest.
          version=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          platforms() {
            docker buildx imagetools inspect --raw "$1" \
              | jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | .digest' | sort
          }
          # Each inspection in an assignment of its own, so a failed one stops the step instead of reading as empty.
          gated=$(platforms "${IMAGE}@${DIGEST}")
          tagged=$(platforms "$version")
          if [ -z "$gated" ]; then echo "no platform images under ${IMAGE}@${DIGEST}" >&2; exit 1; fi
          diff <(printf '%s\n' "$gated") <(printf '%s\n' "$tagged")
          echo "Tagged ${IMAGE}@${DIGEST}:"; jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
