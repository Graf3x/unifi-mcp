# unifi-mcp with a Cloudflare tunnel, for running it yourself. See README, guide 2 (code sign-in) or guide 3 (Google).
#   cp .env.example .env    # then fill it in
#   mkdir -p data run run-public   # create these as you, so the containers (PUID:PGID) can write to them
#   docker compose up -d
#
# The server listens on two Unix sockets, each in a folder of its own:
#   run-public/public.sock  the Claude connector (Google sign-in + OAuth), reached only by the cloudflared sidecar
#                           below, which mounts this folder and nothing else;
#   run/mcp.sock            optional tailnet access through `tailscale serve` on the host (see README). The sidecar never
#                           sees it: this socket trusts the login its caller names, so only the host may reach it.
# Optionally also a token-only LAN listener on port 7420 (README, guide 4): uncomment its two lines below.
# and serves the setup page on port 5198, published on the host's 127.0.0.1 only. Its link (with a key that changes on
# every start) is in `docker compose logs unifi-mcp`. MCP_SETUP_PAGE=off in .env turns it off.
# (deploy/ holds the owner's Fleet bundle; it is not used here.)
services:
  unifi-mcp:
    # The image is published by this repo's GitHub workflow. Pin a version (e.g. :0.2.1) if you prefer.
    # Each release is started and checked on amd64 and arm64 before it is tagged. Before you pull a new one, back up ./data
    # and note this image's digest, so you can roll back (README, "Backup and rollback").
    image: ghcr.io/graf3x/unifi-mcp:latest
    # To build from this checkout instead of pulling, uncomment these two lines:
    # build: .
    # pull_policy: build
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      # Inside the container the page must listen on every interface to be published; the port below keeps it local.
      MCP_SETUP_LISTEN: http://0.0.0.0:5198
      # The LAN listener, next to the connector. Set MCP_LAN_ACCESS_TOKEN in .env, then uncomment this and the port below.
      # MCP_LAN_LISTEN: http://0.0.0.0:7420
    ports:
      - "127.0.0.1:5198:5198"
      # - "7420:7420"
    volumes:
      - ./data:/data
      - ./run:/run/unifi-mcp
      - ./run-public:/run/unifi-mcp-public

  cloudflared:
    # 2026.11.0 (multi-arch index digest).
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    # Only the tunnel token; the sidecar never sees the UniFi or Google values.
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    # The public socket's folder only, never ./run (not even read-only): the tunnel's route is
    # unix:/run/unifi-mcp-public/public.sock.
    volumes:
      - ./run-public:/run/unifi-mcp-public
    depends_on:
      - unifi-mcp
