<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device diagnostics</title>
<style>
  /* Dark is the default; the script sets data-theme from the host, else from the system. The page paints its own
     ground, so its text is readable whatever the host puts behind the frame. */
  :root {
    --ground: #0F1318; --surface: #171C23; --border: #2A3340; --text: #E6EAF0; --muted: #9AA6B5;
    --blue: #5AA9FF; --orange: #FFA24A; --red: #FF7A88; --on: #0F1318;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ground: #F6F8FA; --surface: #FFFFFF; --border: #D5DCE5; --text: #1B2430; --muted: #5B6877;
    --blue: #1F6FD6; --orange: #B25E00; --red: #C8324A; --on: #FFFFFF;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); }
  body { padding: 12px; color: var(--text); font: 14px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  p { margin: 0; }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 var(--font-mono, ui-monospace, Consolas, monospace); }
  .muted { color: var(--muted); }
  .bad { color: var(--red); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 10px; }
  .bar .grow { flex: 1 1 200px; min-width: 0; }
  .action { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
  .action:hover:not(:disabled) { border-color: var(--blue); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .tile { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .tile:hover:not(:disabled) { border-color: var(--blue); }
  .tile .name { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .tile .line { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11.5px; border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; }
  .chip.update { color: var(--blue); }
  .chip.issue { color: var(--red); }
  .sentence { margin-bottom: 10px; overflow-wrap: anywhere; }

  /* The faceplate. A port's look: up (blue), slow (orange, marked ~), fault (pink-red, marked !), no link (outline),
     disabled (dimmed). Fault and slow carry a mark so colour is not the only signal. */
  .face { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .block { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); gap: 6px 5px; }
  .block.row { grid-template-rows: auto; }
  .block.others { display: flex; flex-wrap: wrap; }
  .port { position: relative; width: 34px; height: 30px; padding: 0; border: 1px solid var(--muted); border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .others .port { width: auto; min-width: 34px; max-width: 120px; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .look-up { background: var(--blue); border-color: var(--blue); color: var(--on); }
  .look-slow { background: var(--orange); border-color: var(--orange); color: var(--on); }
  .look-fault { background: var(--red); border-color: var(--red); color: var(--on); }
  .look-off { border-style: dashed; opacity: .45; }
  .port[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }
  .port .mark { position: absolute; top: -1px; right: 3px; font-size: 11px; font-weight: 700; line-height: 1.1; }
  .port.poe::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 2px; height: 2px; border-radius: 1px; background: currentColor; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .legend > span { display: inline-flex; align-items: center; }
  .swatch { flex: none; width: 12px; height: 12px; margin-right: 5px; border: 1px solid var(--muted); border-radius: 3px; }
  .swatch.bar { height: 3px; width: 14px; border: 0; border-radius: 1px; background: var(--muted); }
  .panel { margin-top: 12px; }
  .panel h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .small { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
  .note { margin-top: 6px; overflow-wrap: anywhere; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #status { margin-top: 10px; color: var(--orange); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main id="app"><p class="muted">Waiting for the answer…</p></main>
<p id="status" role="status" hidden></p>
<script>
/* mcp-app client: reusable, start */
/* The view's side of MCP Apps (io.modelcontextprotocol/ui, 2026-01-26): JSON-RPC over postMessage with the host that
   frames this page. It knows nothing about what the view shows. */
function createApp(info) {
  "use strict";
  var nextId = 1, pending = {}, context = null, lastSize = "";
  var handlers = { result: [], input: [], context: [] };

  function post(message) { window.parent.postMessage(message, "*"); }
  function notify(method, params) { post({ jsonrpc: "2.0", method: method, params: params }); }
  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending[id] = { resolve: resolve, reject: reject };
      post({ jsonrpc: "2.0", id: id, method: method, params: params });
    });
  }
  function emit(kind, value) { handlers[kind].forEach(function (fn) { fn(value); }); }
  function merge(over) {
    var merged = {};
    [context, over].forEach(function (part) { Object.keys(part || {}).forEach(function (key) { merged[key] = part[key]; }); });
    context = merged;
    emit("context", context);
  }
  function reportSize() {
    var width = document.body.offsetWidth, height = document.body.offsetHeight;
    if (width + "x" + height === lastSize) return;
    lastSize = width + "x" + height;
    notify("ui/notifications/size-changed", { width: width, height: height });
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    var message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.method === undefined) {
      var waiting = pending[message.id];
      if (!waiting) return;
      delete pending[message.id];
      if (message.error) waiting.reject(new Error(typeof message.error.message === "string" ? message.error.message : "The host refused."));
      else waiting.resolve(message.result);
    }
    else if (message.method === "ui/notifications/tool-result") emit("result", message.params || {});
    else if (message.method === "ui/notifications/tool-input") emit("input", (message.params && message.params.arguments) || {});
    else if (message.method === "ui/notifications/host-context-changed") merge(message.params);
    else if (message.id !== undefined) post({ jsonrpc: "2.0", id: message.id, result: {} }); // a request from the host, such as a ping
  });

  var ready = request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: info, appCapabilities: {} }).then(function (result) {
    notify("ui/notifications/initialized");
    merge(result && result.hostContext);
    if (window.ResizeObserver) new ResizeObserver(reportSize).observe(document.body);
    reportSize();
    return result;
  });
  ready.catch(function () {}); // a host that refuses the handshake leaves the page as it is

  return {
    ready: ready,
    onResult: function (fn) { handlers.result.push(fn); },
    onInput: function (fn) { handlers.input.push(fn); },
    onContext: function (fn) { handlers.context.push(fn); if (context) fn(context); },
    callTool: function (name, args) { return request("tools/call", { name: name, arguments: args }); },
    sendMessage: function (text) { return request("ui/message", { role: "user", content: { type: "text", text: text } }); },
    updateContext: function (text) { return request("ui/update-model-context", { content: [{ type: "text", text: text }] }).catch(function () {}); },
  };
}
/* mcp-app client: reusable, end */

/* The device diagnostics view. Every value from a result is written as text, never as markup. */
(function () {
  "use strict";
  var TOOL = "device_diagnostics_faq", META_KEY = "unifi-network/view";
  var app = createApp({ name: "unifi-device-diagnostics", version: "1" });
  var root = document.getElementById("app"), statusLine = document.getElementById("status");
  var state = { model: null, devicesModel: null, selectedPort: null, status: "" };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function known(value) { return typeof value === "number" && isFinite(value); }
  function list(value) { return Array.isArray(value) ? value : []; }
  function duration(seconds) {
    if (!known(seconds) || seconds < 0) return "?";
    var days = Math.floor(seconds / 86400), hours = Math.floor(seconds % 86400 / 3600), minutes = Math.floor(seconds % 3600 / 60);
    return days >= 1 ? days + " d " + hours + " h" : hours >= 1 ? hours + " h " + minutes + " min" : minutes + " min";
  }

  /* The view's data rides in the result's _meta, where the model does not see it. */
  function modelOf(result) {
    var model = result && result._meta && result._meta[META_KEY];
    return model && (model.view === "devices" || model.view === "device" || model.view === "message") ? model : null;
  }
  function textOf(result) {
    return list(result && result.content).filter(function (block) { return block && block.type === "text" && typeof block.text === "string"; })
      .map(function (block) { return block.text; }).join("\n\n");
  }
  function setStatus(text) {
    state.status = text ? String(text).slice(0, 400) : "";
    statusLine.textContent = state.status;
    statusLine.hidden = !state.status;
  }
  function replace(nodes) {
    root.textContent = "";
    nodes.forEach(function (node) { root.appendChild(node); });
  }

  /* --- theme ------------------------------------------------------------------------------------------------- */

  var hostContext = null;
  var systemLight = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
  function applyTheme() {
    var asked = hostContext && hostContext.theme;
    var theme = asked === "light" || asked === "dark" ? asked : systemLight && systemLight.matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", theme);
    var variables = (hostContext && hostContext.styles && hostContext.styles.variables) || {};
    ["--font-sans", "--font-mono"].forEach(function (name) {
      var value = variables[name];
      if (typeof value === "string" && value && value.indexOf("(") < 0) document.documentElement.style.setProperty(name, value); // names only, nothing that loads
    });
  }
  if (systemLight && systemLight.addEventListener) systemLight.addEventListener("change", applyTheme);
  applyTheme();
  app.onContext(function (context) { hostContext = context; applyTheme(); });

  /* --- calls the view makes itself ----------------------------------------------------------------------------- */

  /* Opens or refreshes one device. Only a device answer replaces the screen; a message or a refusal leaves the
     screen as it is and says why underneath. */
  function open(mac, button) {
    var args = { device: mac };
    if (state.model && state.model.siteId) args.siteId = state.model.siteId;
    if (button) button.disabled = true;
    setStatus("");
    return app.callTool(TOOL, args).then(function (result) {
      var model = modelOf(result);
      if (model && model.view === "device" && model.device) {
        if (state.model && state.model.view !== "device") state.devicesModel = state.model;
        show(model);
      }
      else setStatus((model && model.message) || textOf(result) || "The answer had nothing to show.");
    }, function (error) {
      setStatus("Could not refresh: " + (error && error.message ? error.message.replace(/[.\s]+$/, "") : "the host refused the call") + ".");
    }).then(function () { if (button && button.isConnected) button.disabled = false; });
  }

  /* --- screens ------------------------------------------------------------------------------------------------- */

  function tile(name, lines, chips, mac) {
    var button = el("button", "tile");
    button.type = "button";
    button.appendChild(el("span", "name", name || "(unnamed)"));
    lines.forEach(function (line) { button.appendChild(line); });
    if (chips.length > 0) {
      var row = el("span", "chips");
      chips.forEach(function (chip) { row.appendChild(chip); });
      button.appendChild(row);
    }
    button.addEventListener("click", function () { open(mac, button); });
    return button;
  }

  function deviceTile(d) {
    var first = el("span", "line");
    first.appendChild(document.createTextNode((d.model || "?") + " · "));
    first.appendChild(el("span", d.state === "online" ? "" : "bad", d.state));
    var facts = [];
    if (known(d.uptimeSeconds)) facts.push("up " + duration(d.uptimeSeconds));
    if (known(d.cpuPct)) facts.push("CPU " + d.cpuPct + " %");
    if (known(d.memoryPct)) facts.push("memory " + d.memoryPct + " %");
    if (known(d.temperatureC)) facts.push(d.temperatureC + " °C");
    var lines = [first];
    if (facts.length > 0) lines.push(el("span", "line", facts.join(" · ")));
    var chips = [];
    if (d.updateTo) chips.push(el("span", "chip update", "update available"));
    list(d.issues).forEach(function (issue) { chips.push(el("span", "chip issue", issue)); });
    return tile(d.name, lines, chips, d.mac);
  }

  function renderDevices(model) {
    var grid = el("div", "tiles");
    list(model.devices).forEach(function (d) { grid.appendChild(deviceTile(d)); });
    replace([grid]);
  }

  function renderMessage(model) {
    var nodes = [el("p", "sentence", model.message || "")];
    var candidates = list(model.candidates);
    if (candidates.length > 0) {
      var grid = el("div", "tiles");
      candidates.forEach(function (c) { grid.appendChild(tile(c.name, [el("span", "line", c.ip || ""), el("span", "line", c.mac || "")], [], c.mac)); });
      nodes.push(grid);
    }
    replace(nodes);
  }

  function deviceHeader(d) {
    var bar = el("div", "bar");
    if (state.devicesModel) {
      var back = el("button", "action", "Back");
      back.type = "button";
      back.addEventListener("click", function () {
        var earlier = state.devicesModel;
        state.devicesModel = null;
        state.selectedPort = null;
        show(earlier);
        app.updateContext("The user is looking at the device list in the device diagnostics view.");
      });
      bar.appendChild(back);
    }
    var title = el("div", "grow");
    title.appendChild(el("h1", "", d.name || "(unnamed)"));
    var facts = el("p", "muted");
    facts.appendChild(document.createTextNode((d.model || "?") + " · "));
    facts.appendChild(el("span", d.state === "online" ? "" : "bad", d.state));
    var more = [];
    if (known(d.poeBudgetW)) more.push("PoE " + (known(d.poeUsedW) ? d.poeUsedW : "?") + " of " + d.poeBudgetW + " W");
    if (known(d.uptimeSeconds)) more.push("up " + duration(d.uptimeSeconds));
    if (more.length > 0) facts.appendChild(document.createTextNode(" · " + more.join(" · ")));
    title.appendChild(facts);
    bar.appendChild(title);
    var refresh = el("button", "action", "Refresh");
    refresh.type = "button";
    refresh.id = "refresh";
    refresh.disabled = refreshing;
    refresh.addEventListener("click", function () {
      // The console keeps an answer for 10 seconds, so a sooner refresh would only show the same one.
      refreshing = true;
      refresh.disabled = true;
      open(d.mac, null).then(function () {
        setTimeout(function () {
          refreshing = false;
          var current = document.getElementById("refresh");
          if (current) current.disabled = false;
        }, 10000);
      });
    });
    bar.appendChild(refresh);
    return bar;
  }

  /* --- the faceplate --------------------------------------------------------------------------------------------- */

  var FAULTS = ["errors", "flapping", "half duplex"];
  var LOOKS = { up: "normal", slow: "slow", fault: "fault", nolink: "no link", off: "disabled" };
  var refreshing = false;

  function look(port) {
    var flags = list(port.flags);
    if (port.state === "disabled") return "off";
    if (flags.some(function (flag) { return FAULTS.indexOf(flag) >= 0; })) return "fault";
    if (flags.indexOf("slow link") >= 0) return "slow";
    return port.state === "up" ? "up" : "nolink";
  }
  function stateWord(port) { return port.state === "up" ? "up" : port.state === "disabled" ? "disabled" : "no link"; }
  function speedLabel(mbps) { return !known(mbps) ? "?" : mbps < 1000 ? mbps + " Mb" : mbps / 1000 + " GbE"; }
  function count(value) { return (known(value) ? value : 0).toLocaleString(); }
  /* Names the owner gave (a device, a port) go into chat messages on one line; names a client gave itself never do. */
  function oneLine(value) { return String(value || "").replace(/[\s"]+/g, " ").trim().slice(0, 60); }
  function isMac(value) { return typeof value === "string" && /^[0-9a-f]{2}([:-][0-9a-f]{2}){5}$/i.test(value); }

  function tellModel(device, port) {
    app.updateContext("The user is looking at " + oneLine(device.name) + " (" + device.mac + ") in the device diagnostics view" +
      (port ? ", port " + port.index + " (\"" + oneLine(port.name) + "\"; " + stateWord(port) +
              (list(port.flags).length > 0 ? "; " + list(port.flags).join(", ") : "") + ")." : "."));
  }

  function whyMessage(device, port) {
    var link = port.state === "up"
      ? "It is linked at " + (known(port.speedMbps) ? port.speedMbps : "?") + " Mb " + (port.duplex || "?") + " duplex" +
        (known(port.maxSpeedMbps) ? ", port maximum " + port.maxSpeedMbps + " Mb" : "")
      : "It has no link at the moment";
    return "Why is port " + port.index + " (\"" + oneLine(port.name) + "\") on " + oneLine(device.name) + " (" + device.mac + ") flagged " +
      list(port.flags).join(", ") + "? " + link + ", with " + (port.rxErrors || 0) + " receive errors, " + (port.txErrors || 0) + " send errors, " +
      (port.drops || 0) + " drops and " + (port.linkDowns || 0) + " link downs since the device restarted. What is the likely cause?";
  }

  function say(text) {
    setStatus("");
    app.sendMessage(text).then(function (result) {
      if (result && result.isError) setStatus("Claude did not take the message.");
    }, function () { setStatus("Claude did not take the message."); });
  }

  function fact(facts, name, value) {
    facts.appendChild(el("dt", "", name));
    facts.appendChild(el("dd", "", value));
  }

  function renderPanel(panel, device, port) {
    panel.textContent = "";
    if (!port) {
      panel.appendChild(el("p", "muted", "Pick a port to see its details."));
      return;
    }
    var named = port.name && port.name !== "Port " + port.index; // the console's default name says nothing new
    panel.appendChild(el("h2", "", "Port " + port.index + (named ? " · " + port.name : "")));
    var facts = el("dl", "facts");
    fact(facts, "Link", port.state === "up"
      ? speedLabel(port.speedMbps) + ", " + (port.duplex || "?") + " duplex" + (known(port.maxSpeedMbps) ? " (port can do " + speedLabel(port.maxSpeedMbps) + ")" : "")
      : stateWord(port));
    var connected = list(port.connected), total = known(port.connectedCount) ? port.connectedCount : connected.length;
    fact(facts, "Connected", connected.length === 0 ? "nothing seen"
      : connected.map(function (c) { return c.name; }).join(", ") + (total > connected.length ? " +" + (total - connected.length) + " more" : ""));
    fact(facts, "PoE", known(port.poeW) ? port.poeW + " W" : "off");
    fact(facts, "Errors", count(port.rxErrors) + " received, " + count(port.txErrors) + " sent");
    fact(facts, "Drops", count(port.drops));
    fact(facts, "Link downs", count(port.linkDowns));
    panel.appendChild(facts);
    panel.appendChild(el("p", "small", "Counters run since the device restarted" + (known(device.uptimeSeconds) ? ", " + duration(device.uptimeSeconds) + " ago." : ".")));
    if (port.note) panel.appendChild(el("p", "note", port.note));

    var buttons = el("div", "buttons");
    if (list(port.flags).length > 0) {
      var why = el("button", "action", "Ask Claude why");
      why.type = "button";
      why.addEventListener("click", function () { say(whyMessage(device, port)); });
      buttons.appendChild(why);
    }
    if (total === 1 && connected.length === 1 && connected[0].kind === "client" && isMac(connected[0].mac)) {
      var trace = el("button", "action", "Trace its path");
      trace.type = "button";
      trace.addEventListener("click", function () { say("Trace the network path of the client with MAC " + connected[0].mac + "."); });
      buttons.appendChild(trace);
    }
    if (buttons.childNodes.length > 0) panel.appendChild(buttons);
  }

  function renderDevice(model) {
    var device = model.device, ports = list(device.ports);
    var nodes = [deviceHeader(device)];
    if (ports.length === 0) {
      state.selectedPort = null;
      replace(nodes);
      tellModel(device, null);
      return;
    }

    var panel = el("section", "panel");
    panel.setAttribute("aria-label", "Port details");
    var buttons = [];
    function select(port, announce) {
      state.selectedPort = port ? port.index : null;
      buttons.forEach(function (entry) { entry.button.setAttribute("aria-pressed", entry.port === port ? "true" : "false"); });
      renderPanel(panel, device, port);
      if (announce) tellModel(device, port);
    }
    function portButton(port, label) {
      var kind = look(port), flags = list(port.flags);
      var button = el("button", "port look-" + kind + (port.poeW > 0 ? " poe" : ""), label);
      button.type = "button";
      button.setAttribute("aria-label", "Port " + port.index + ", " + (port.name || "") + ", " + stateWord(port) + (flags.length > 0 ? ", " + flags.join(", ") : ""));
      if (kind === "fault" || kind === "slow") {
        var mark = el("span", "mark", kind === "fault" ? "!" : "~");
        mark.setAttribute("aria-hidden", "true");
        button.appendChild(mark);
      }
      button.addEventListener("click", function () { select(port, true); });
      buttons.push({ port: port, button: button });
      return button;
    }

    /* Copper in blocks of six columns, odd numbers on top; five or fewer in one row; other connectors apart. */
    var face = el("div", "face");
    var copper = ports.filter(function (p) { return !p.connector || p.connector === "RJ45"; });
    var others = ports.filter(function (p) { return p.connector && p.connector !== "RJ45"; });
    for (var start = 0; start < copper.length; start += 12) {
      var block = el("div", copper.length <= 5 ? "block row" : "block");
      copper.slice(start, start + 12).forEach(function (p) { block.appendChild(portButton(p, p.index)); });
      face.appendChild(block);
    }
    if (others.length > 0) {
      var apart = el("div", "block others");
      others.forEach(function (p) { apart.appendChild(portButton(p, p.name || p.index)); });
      face.appendChild(apart);
    }
    nodes.push(face);

    var legend = el("p", "legend");
    Object.keys(LOOKS).forEach(function (kind) {
      var item = el("span", "");
      item.appendChild(el("span", "swatch look-" + kind));
      item.appendChild(document.createTextNode(LOOKS[kind]));
      legend.appendChild(item);
    });
    var poe = el("span", "");
    poe.appendChild(el("span", "swatch bar"));
    poe.appendChild(document.createTextNode("delivering PoE"));
    legend.appendChild(poe);
    nodes.push(legend);
    nodes.push(panel);
    replace(nodes);

    /* Keep the port that was selected; else the first fault; else the first slow port; else none. */
    function first(kind) { return ports.filter(function (p) { return look(p) === kind; })[0]; }
    var chosen = ports.filter(function (p) { return p.index === state.selectedPort; })[0] || first("fault") || first("slow") || null;
    select(chosen, true);
  }

  function show(model) {
    state.model = model;
    setStatus("");
    if (model.view === "devices") renderDevices(model);
    else if (model.view === "device" && model.device) renderDevice(model);
    else renderMessage(model);
  }

  function showText(text) {
    state.model = null;
    setStatus("");
    replace([el("pre", "", text || "The answer had no text.")]);
  }

  /* A result the host hands over starts afresh: nothing to go back to, nothing selected. */
  app.onResult(function (result) {
    state.devicesModel = null;
    state.selectedPort = null;
    var model = modelOf(result);
    if (model) show(model);
    else showText(textOf(result));
  });
})();
</script>
</body>
</html>
