<text class="m" x="676" y="388">mcp.sock</text>
<rect x="858" y="218" width="114" height="80" rx="8" fill="#161B22" stroke="#3D444D" stroke-width="1.5"/>
<text class="t" x="915" y="255" text-anchor="middle">UniFi console</text>
<text class="mm" x="915" y="274" text-anchor="middle">192.168.1.1</text>
