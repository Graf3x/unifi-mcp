<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="The three ways Claude reaches unifi-mcp: locally, through a Cloudflare tunnel, or over Tailscale">
<title>The three ways Claude reaches unifi-mcp: locally, through a Cloudflare tunnel, or over Tailscale</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .t { font-size: 15px; font-weight: 600; fill: #F0F6FC; }
  .s { font-size: 12.5px; fill: #9198A1; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #F0F6FC; }
  .mm { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #9198A1; }
  .l { font-size: 13px; font-weight: 600; fill: #9198A1; }
  .tag { font-size: 11.5px; font-weight: 600; }
  .n { font-size: 12px; font-weight: 700; fill: #0D1117; }
  .halo { paint-order: stroke; stroke: #0D1117; stroke-width: 5px; stroke-linejoin: round; }
</style>
<text class="l" x="20" y="40">Internet</text>
