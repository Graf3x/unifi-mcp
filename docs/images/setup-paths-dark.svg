<path d="M356 132 H428" fill="none" stroke="#F0883E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M578 132 H660" fill="none" stroke="#F0883E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M578 258 H660" fill="none" stroke="#4493F8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170 384 H428" fill="none" stroke="#3FB950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 384 H428" fill="none" stroke="#0D1117" stroke-width="2.2" stroke-dasharray="5 7" stroke-linecap="butt"/>
<path d="M578 384 H660" fill="none" stroke="#3FB950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M578 384 H660" fill="none" stroke="#0D1117" stroke-width="2.2" stroke-dasharray="5 7" stroke-linecap="butt"/>
<path d="M810 258 H858" fill="none" stroke="#9198A1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="s halo" x="392" y="120" text-anchor="middle">tunnel</text>
<text class="s" x="286" y="372" text-anchor="middle">Tailscale, HTTPS :7420</text>
<rect x="20" y="66" width="112" height="20" rx="10" fill="none" stroke="#F0883E" stroke-width="1.5"/>
<text class="tag" x="76" y="80" text-anchor="middle" fill="#F0883E">Guides 2 and 3</text>
