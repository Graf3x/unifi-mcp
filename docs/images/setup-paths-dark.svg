<rect x="657" y="261" width="6" height="4" fill="#F0F6FC"/>
<text class="m" x="676" y="262">127.0.0.1:5199</text>
<rect x="653" y="376" width="14" height="16" rx="2" fill="#161B22" stroke="#F0F6FC" stroke-width="1.5"/>
