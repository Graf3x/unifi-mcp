<path d="M330 347 C 480 347, 472 326, 622 326" fill="none" stroke="#9A6700" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 347 C 480 347, 472 326, 622 326" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-dasharray="5 7" stroke-linecap="butt"/>
<path d="M330 347 C 480 347, 472 352, 622 352" fill="none" stroke="#9A6700" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 347 C 480 347, 472 352, 622 352" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-dasharray="5 7" stroke-linecap="butt"/>
