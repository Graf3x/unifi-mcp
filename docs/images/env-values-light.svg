<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="1000" height="448" role="img" aria-label="Where each value in .env comes from">
<title>Where each value in .env comes from</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .t { font-size: 15px; font-weight: 600; fill: #1F2328; }
  .s { font-size: 12.5px; fill: #59636E; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1F2328; }
  .mm { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #59636E; }
  .l { font-size: 13px; font-weight: 600; fill: #59636E; }
  .tag { font-size: 11.5px; font-weight: 600; }
  .n { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
  .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 5px; stroke-linejoin: round; }
</style>
