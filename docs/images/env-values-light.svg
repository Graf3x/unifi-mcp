<rect x="20" y="48" width="310" height="48" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="t" x="34" y="68" style="font-size:14px">Your shell</text>
<text class="mm" x="34" y="85">id -u and id -g</text>
<rect x="20" y="103" width="310" height="48" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="t" x="34" y="123" style="font-size:14px">UniFi Network</text>
<text class="s" x="34" y="140">Settings &gt; Control Plane &gt; Integrations</text>
<rect x="20" y="158" width="310" height="48" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="t" x="34" y="178" style="font-size:14px">Console certificate</text>
<text class="s" x="34" y="195">openssl, then confirmed over SSH</text>
<rect x="20" y="213" width="310" height="48" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="t" x="34" y="233" style="font-size:14px">Cloudflare Zero Trust</text>
<text class="s" x="34" y="250">Networks &gt; Tunnels, and your hostname</text>
<rect x="20" y="268" width="310" height="48" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="t" x="34" y="288" style="font-size:14px">How you sign in</text>
<text class="s" x="34" y="305">code in guide 2, google in guide 3</text>
<rect x="20" y="323" width="310" height="48" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="t" x="34" y="343" style="font-size:14px">Google Cloud Console</text>
<text class="s" x="34" y="360">guide 3 only</text>
<rect x="20" y="378" width="310" height="48" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="t" x="34" y="398" style="font-size:14px">A random key you keep</text>
<text class="mm" x="34" y="415">openssl rand -base64 32</text>
<rect x="600" y="44" width="380" height="386" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<path d="M600 72 H980" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="m" x="616" y="63" style="font-weight:700">.env</text>
<circle cx="622" cy="92" r="4" fill="#9A6700"/>
<text class="m" x="634" y="96">PUID<tspan fill="#59636E">=1000</tspan></text>
<circle cx="622" cy="118" r="4" fill="#9A6700"/>
<text class="m" x="634" y="122">PGID<tspan fill="#59636E">=1000</tspan></text>
<circle cx="622" cy="144" r="4" fill="#9A6700"/>
<text class="m" x="634" y="148">UNIFI_URL<tspan fill="#59636E">=https://192.168.1.1</tspan></text>
<circle cx="622" cy="170" r="4" fill="#9A6700"/>
<text class="m" x="634" y="174">UNIFI_API_KEY<tspan fill="#59636E">=</tspan></text>
<circle cx="622" cy="196" r="4" fill="#9A6700"/>
<text class="m" x="634" y="200">UNIFI_CERT_SHA256<tspan fill="#59636E">=</tspan></text>
<text class="m" x="634" y="226">UNIFI_ALLOW_WRITES<tspan fill="#59636E">=false</tspan></text>
<circle cx="622" cy="248" r="4" fill="#9A6700"/>
<text class="m" x="634" y="252">MCP_PUBLIC_BASE_URL<tspan fill="#59636E">=https://unifi.example.com</tspan></text>
<circle cx="622" cy="274" r="4" fill="#9A6700"/>
<text class="m" x="634" y="278">MCP_SIGNIN<tspan fill="#59636E">=code</tspan></text>
<circle cx="622" cy="300" r="4" fill="#9A6700"/>
<text class="m" x="634" y="304">GOOGLE_CLIENT_ID<tspan fill="#59636E">=</tspan></text>
<circle cx="622" cy="326" r="4" fill="#9A6700"/>
<text class="m" x="634" y="330">GOOGLE_CLIENT_SECRET<tspan fill="#59636E">=</tspan></text>
<circle cx="622" cy="352" r="4" fill="#9A6700"/>
<text class="m" x="634" y="356">MCP_ALLOWED_GOOGLE_EMAILS<tspan fill="#59636E">=</tspan></text>
<circle cx="622" cy="378" r="4" fill="#9A6700"/>
<text class="m" x="634" y="382">UNIFI_MCP_DATA_KEY<tspan fill="#59636E">=</tspan></text>
<circle cx="622" cy="404" r="4" fill="#9A6700"/>
<text class="m" x="634" y="408">TUNNEL_TOKEN<tspan fill="#59636E">=</tspan></text>
</svg>
