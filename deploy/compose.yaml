# No published ports. The tailnet side listens on ./run/mcp.sock, reached through `tailscale serve` on the host; the public
# side listens on ./run/public.sock, reached only by the cloudflared sidecar (route unifi.example.com -> unix:/run/unifi-mcp/public.sock).
# The public hostname below is a placeholder: set MCP_PUBLIC_BASE_URL to your real host when deploying.
# Owner-supplied files live in ./config (see README). Write tools are on (UNIFI_ALLOW_WRITES); each still needs a per-call confirm.
# Owner keys (fleet-key, declared in fleet.yaml): UNIFI_API_KEY, UNIFI_CERT_SHA256, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, UNIFI_MCP_TUNNEL_TOKEN.
# UNIFI_MCP_DATA_KEY is a Fleet-generated secret that wraps the OAuth keyring in ./data.
services:
  unifi-mcp:
    build:
      context: ./build
    image: unifi-mcp:0.9.0
    pull_policy: build
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      UNIFI_URL: https://192.168.1.1
      UNIFI_SITE: default
      UNIFI_ALLOW_WRITES: "true"
      UNIFI_API_KEY: ${UNIFI_API_KEY}
      UNIFI_CERT_SHA256: ${UNIFI_CERT_SHA256}
      MCP_PUBLIC_BASE_URL: https://unifi.example.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      UNIFI_MCP_DATA_KEY: ${UNIFI_MCP_DATA_KEY}
      DOTNET_EnableDiagnostics: "0"
    volumes:
      - ./config:/config:ro
      - ./run:/run/unifi-mcp
      - ./data:/data

  cloudflared:
    # 2026.11.0 (multi-arch index digest).
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    read_only: true
    environment:
      TUNNEL_TOKEN: ${UNIFI_MCP_TUNNEL_TOKEN}
    volumes:
      - ./run:/run/unifi-mcp
    depends_on:
      - unifi-mcp
